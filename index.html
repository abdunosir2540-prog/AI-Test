<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐍 3D Iloncha O'yini</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header-row">
            <h1>🐍 3D Iloncha</h1>
            <button id="soundBtn" class="sound-btn" title="Ovozni yoqish/o'chirish">🔊</button>
        </div>

        <div class="stats">
            <div class="stat-box">
                <span class="stat-label">Ball</span>
                <span class="stat-value" id="score">0</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Rekord</span>
                <span class="stat-value" id="highScore">0</span>
            </div>
        </div>

        <div class="game-wrapper">
            <div id="game3d"></div>

            <div class="overlay" id="overlay">
                <div class="overlay-content">
                    <h2 id="overlayTitle">3D Iloncha O'yini</h2>
                    <p id="overlayText">Boshlash uchun "Boshlash" tugmasini bosing</p>
                    <button id="startBtn">Boshlash</button>
                </div>
            </div>
        </div>

        <div class="controls">
            <p>Boshqarish: <strong>↑ ↓ ← →</strong> yoki <strong>W A S D</strong></p>
            <p>To'xtatish: <strong>Space</strong> | Qayta boshlash: <strong>R</strong> | Ovoz: <strong>M</strong></p>
        </div>

        <div class="mobile-controls">
            <button class="arrow-btn" data-dir="up">▲</button>
            <div class="row">
                <button class="arrow-btn" data-dir="left">◀</button>
                <button class="arrow-btn" data-dir="down">▼</button>
                <button class="arrow-btn" data-dir="right">▶</button>
            </div>
        </div>
    </div>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
